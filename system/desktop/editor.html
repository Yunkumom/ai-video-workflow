(async()=>{
  try {
    doc=await api('project');draw();status(T('loaded'));refreshLayouts();refreshHistory();
    fonts=await api('fonts');
    for(let script of ['chinese','english']){
      let el=$(script+'Family'),families=[...new Set(fonts.filter(f=>f[script]).map(f=>f.family))];
      el.innerHTML=families.map(f=>`<option>${esc(f)}</option>`).join('');
      el.onchange=()=>{
        let members=fonts.filter(f=>f.family===el.value);
        mutate(()=>doc.styles[orientation][script]=members[Math.floor(members.length/2)].name);
      };
      $(script+'Weight').onchange=()=>{
        let members=fonts.filter(f=>f.family===el.value).sort((a,b)=>a.weight-b.weight||a.name.localeCompare(b.name));
        mutate(()=>doc.styles[orientation][script]=members[Number($(script+'Weight').value)].name);
      };
    }
    drawSettings();
  }catch(e){status(e.message)}
})();
